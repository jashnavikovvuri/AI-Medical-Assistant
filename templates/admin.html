<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary mb-5">
🛠 Admin Dashboard
</h1>

<div class="row">

<div class="col-md-4 mb-4">

<div class="card p-4 text-center">

<i class="bi bi-people-fill display-3 text-primary"></i>

<h4 class="mt-3">Total Users</h4>

<h2>{{ total_users }}</h2>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card p-4 text-center">

<i class="bi bi-activity display-3 text-success"></i>

<h4 class="mt-3">Predictions</h4>

<h2>{{ total_predictions }}</h2>

</div>

</div>

<div class="col-md-4 mb-4">

<div class="card p-4 text-center">

<i class="bi bi-calendar-check display-3 text-warning"></i>

<h4 class="mt-3">Appointments</h4>

<h2>{{ total_appointments }}</h2>

</div>

</div>

</div>

<div class="text-center mt-4">

<a href="/dashboard" class="btn btn-primary">
⬅ Back to Dashboard
</a>

</div>

</div>

</body>

</html>
