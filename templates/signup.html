<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AI Medical Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    <div class="mb-3">
                        <label>Full Name</label>
                        <input
                            type="text"
                            class="form-control"
                            name="name"
                            placeholder="Enter Name"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter Email"
                            required>
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            placeholder="Create Password"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">
                        Sign Up
                    </button>

                </form>

                <div class="text-center mt-3">
                    Already have an account?
                    <a href="/login">Login</a>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
