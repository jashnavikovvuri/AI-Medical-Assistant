<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background:#f4f7fc;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    font-weight:bold;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="/dashboard">

🧠 AI Medical Assistant

</a>

</div>

</nav>

<div class="container mt-5">

<div class="card p-4">

<h2 class="text-center text-primary mb-4">

Patient Profile

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Name

</label>

<input
type="text"
name="name"
class="form-control"
value="{{ patient[1] if patient else '' }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Age

</label>

<input
type="number"
name="age"
class="form-control"
value="{{ patient[2] if patient else '' }}"
required>

</div>

<div class="mb-3">

<label class="form-label">

Gender

</label>

<select
name="gender"
class="form-select">

<option value="Male"
{% if patient and patient[3]=='Male' %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if patient and patient[3]=='Female' %}selected{% endif %}>
Female
</option>

<option value="Other"
{% if patient and patient[3]=='Other' %}selected{% endif %}>
Other
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Blood Group

</label>

<input
type="text"
name="blood_group"
class="form-control"
value="{{ patient[4] if patient else '' }}">

</div>

<div class="mb-3">

<label class="form-label">

Phone

</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ patient[5] if patient else '' }}">

</div>

<div class="mb-3">

<label class="form-label">

Address

</label>

<textarea
name="address"
class="form-control"
rows="3">{{ patient[6] if patient else '' }}</textarea>

</div>

<button
class="btn btn-success w-100">

<i class="bi bi-save"></i>

Save Profile

</button>

</form>

<div class="text-center mt-4">

<a
href="/dashboard"
class="btn btn-primary">

⬅ Back to Dashboard

</a>

</div>

</div>

</div>

</body>

</html>
